[project]
name = "agentic-blog-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Codemonk", email = "78207195+vickyraut@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.10",
    "langgraph-cli[inmem]>=0.4.31",
    "uvicorn>=0.52.1",
    "watchdog>=6.0.0",
]

[project.scripts]
agentic-blog-generator = "agentic_blog_generator:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
